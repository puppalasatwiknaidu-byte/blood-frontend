<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blood Bank - Patient Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast"></div>

  <!-- PATIENT LOGIN / REGISTER -->
  <section id="loginView" class="login">
    <div class="card">
      <h1>🩸 Blood Bank</h1>
      <p class="muted">Patient portal</p>
      <div class="tabs" id="loginTabs">
        <button data-form="loginForm" class="active">Login</button>
        <button data-form="registerForm">Register</button>
      </div>

      <form id="loginForm">
        <input name="username" placeholder="Username" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>

      <form id="registerForm" class="hidden">
        <input name="name" placeholder="Full name *" required />
        <input name="age" type="number" min="0" placeholder="Age *" required />
        <select name="gender"><option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option></select>
        <input name="phone" placeholder="Phone" />
        <select name="blood_group" class="groupSelect" required></select>
        <input name="hospital" placeholder="Hospital *" required />
        <input name="username" placeholder="Choose username *" required />
        <input name="password" type="password" placeholder="Choose password (min 6) *" required />
        <button type="submit">Register</button>
      </form>

      <a href="admin.html" class="muted">Admin login &rarr;</a>
    </div>
  </section>

  <!-- PATIENT PORTAL -->
  <div id="portal" class="hidden">
    <header>
      <strong>🩸 Blood Bank</strong>
      <nav id="nav">
        <button data-tab="requests" class="active">My Requests</button>
        <button data-tab="profile">My Profile</button>
      </nav>
      <span id="hello"></span>
      <button id="logoutBtn" class="ghost">Logout</button>
    </header>

    <main>
      <!-- Requests -->
      <section id="requests" class="tab">
        <h2>Request Blood</h2>
        <p id="info" class="muted"></p>
        <form id="requestForm" class="card form-grid">
          <input name="units_needed" type="number" min="1" placeholder="Units needed *" required />
          <button type="submit">Submit Request</button>
        </form>
        <h3 style="margin-bottom:10px">My Requests</h3>
        <div class="scroll"><table><thead><tr><th>ID</th><th>Group</th><th>Units</th><th>Hospital</th><th>Status</th><th>Action</th></tr></thead><tbody id="requestsBody"></tbody></table></div>
        <p class="muted">You can edit or cancel a request while it is still Pending.</p>
      </section>

      <!-- Profile -->
      <section id="profile" class="tab hidden">
        <h2>My Profile</h2>
        <form id="profileForm" class="card form-grid">
          <label class="muted">Full name<input name="name" required /></label>
          <label class="muted">Age<input name="age" type="number" min="0" required /></label>
          <label class="muted">Gender<select name="gender"><option value="">-</option><option>Male</option><option>Female</option><option>Other</option></select></label>
          <label class="muted">Phone<input name="phone" /></label>
          <label class="muted">Blood group<select name="blood_group" class="groupSelect" required></select></label>
          <label class="muted">Hospital<input name="hospital" required /></label>
          <button type="submit">Save Changes</button>
        </form>
        <p class="muted">Changing your blood group or hospital also updates your pending requests.</p>

        <h3 style="margin:24px 0 10px">Change Password</h3>
        <form id="passwordForm" class="card form-grid">
          <input name="current_password" type="password" placeholder="Current password" required />
          <input name="new_password" type="password" placeholder="New password (min 6)" required />
          <button type="submit">Update Password</button>
        </form>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="patient.js"></script>
</body>
</html>
